<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V12 · 6.5L · 60° DOHC 48V — 可交互拆解模型</title>
<style>
:root{
  --bg:#07080a; --panel:rgba(15,16,19,.74); --line:rgba(255,255,255,.085);
  --txt:#e9ebef; --dim:#8a8f99; --acc:#ff6a2a;
  --s1:#7f8794; --s2:#9aa4b1; --s3:#ff6a2a; --s4:#3fbfa8;
  --s5:#c0563f; --s6:#c8a53f; --s7:#5f7fe0; --s8:#a05fc8;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#brand{position:fixed;left:26px;top:22px;pointer-events:none;z-index:6}
#brand .kicker{font:600 9.5px/1 var(--mono);letter-spacing:.32em;color:var(--acc);opacity:.9}
#brand h1{margin:9px 0 0;font:300 34px/1 var(--sans);letter-spacing:.02em}
#brand h1 span{font-family:var(--mono);font-size:15px;letter-spacing:.08em;color:var(--dim);margin-left:8px;vertical-align:middle}
#brand .sub{margin-top:7px;font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}
#hint{position:fixed;left:26px;bottom:16px;font:500 10.5px/1.5 var(--mono);color:#5e636d;letter-spacing:.04em;z-index:6;pointer-events:none}
#hint b{color:#868c96;font-weight:600}

/* ---- dashboard ---- */
#dash{position:fixed;right:20px;top:20px;width:302px;z-index:7;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;transition:transform .3s,opacity .3s}
#dash.hide{opacity:0;transform:translateX(14px);pointer-events:none}
#tach{width:100%;height:auto;display:block}
.rpmRow{display:flex;align-items:flex-end;gap:8px;margin-top:-6px}
.rpmRow b{font:300 40px/.9 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rpmRow span{font:600 9px/1 var(--mono);color:var(--dim);letter-spacing:.14em;padding-bottom:4px}
.rpmRow i{margin-left:auto;font:600 9px/1 var(--mono);letter-spacing:.12em;color:#4e545e;font-style:normal;padding-bottom:5px}
.rpmRow i.on{color:var(--acc)}
.powRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.powRow>div{display:flex;flex-direction:column;gap:2px}
.powRow b{font:500 15px/1 var(--mono);font-variant-numeric:tabular-nums}
.powRow span{font:600 8.5px/1 var(--mono);color:var(--dim);letter-spacing:.1em}
#curves{width:100%;height:auto;display:block;opacity:.95}
#cyc{width:100%;height:auto;display:block}
#fire{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:2px}
#fire div{height:17px;border:1px solid var(--line);border-radius:3px;font:600 8.5px/17px var(--mono);text-align:center;color:#5c626c;transition:background .12s,color .12s,border-color .12s}
#fire div.nxt{color:var(--acc);border-color:rgba(255,106,42,.55)}
#fire div.hot{background:rgba(255,106,42,.9);color:#0a0a0a;border-color:transparent}
.dashFoot{display:flex;gap:6px;align-items:center;margin-top:2px;font:500 8.5px/1 var(--mono);color:#5c626c;letter-spacing:.08em}
.dashFoot u{flex:1;height:1px;background:var(--line);text-decoration:none}

/* ---- info card ---- */
#card{position:fixed;left:26px;top:152px;width:262px;z-index:7;padding:14px 15px 15px;transition:opacity .22s,transform .22s}
#card.hidden{opacity:0;transform:translateX(-12px);pointer-events:none}
#card .cr{display:flex;align-items:center;gap:7px;font:600 9px/1 var(--mono);letter-spacing:.16em;color:var(--dim)}
#card .cr i{width:6px;height:6px;border-radius:50%;background:var(--acc);display:block}
#card .cr button{margin-left:auto;background:none;border:0;color:#6a707a;font-size:15px;cursor:pointer;padding:0 0 0 8px;line-height:1}
#card .cr button:hover{color:#fff}
#card h2{margin:11px 0 3px;font:400 20px/1.2 var(--sans)}
#card .en{font:500 10.5px/1.3 var(--mono);color:#6f757f;letter-spacing:.02em}
#card .spec{margin:12px 0 0;padding:9px 0 0;border-top:1px solid var(--line);font:500 11px/1.65 var(--mono);color:#aeb4be;white-space:pre-line}
#card p{margin:11px 0 0;font:400 11.5px/1.75 var(--sans);color:#9298a2}

/* ---- bottom bar ---- */
#bar{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:12px;padding:9px 12px;max-width:calc(100vw - 40px)}
#bar .sl{display:flex;align-items:center;gap:9px;padding-right:12px;border-right:1px solid var(--line)}
#bar .sl label{font:600 9px/1 var(--mono);letter-spacing:.14em;color:var(--dim);white-space:nowrap}
#bar .sl b{color:var(--acc);font-variant-numeric:tabular-nums;min-width:26px;display:inline-block;text-align:right}
#bar .sl.wide b{min-width:38px}
input[type=range]{-webkit-appearance:none;appearance:none;width:104px;height:2px;background:linear-gradient(90deg,rgba(255,106,42,.85),rgba(255,255,255,.16));border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--acc);cursor:grab;box-shadow:0 0 8px rgba(255,106,42,.5)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--acc);cursor:grab}
/* 窄屏：底栏改成贴边可横向滚动，避免两个滑块+9 个按钮被挤成三行 */
@media (max-width:1080px){#bar{left:8px;right:8px;transform:none;max-width:none;overflow-x:auto}#bar .sl{flex:0 0 auto}}
.btns{display:flex;gap:3px;flex-wrap:nowrap}
button.b{background:rgba(255,255,255,.035);border:1px solid var(--line);color:#b6bcc6;font:500 11px/1 var(--sans);padding:8px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:5px}
button.b:hover{background:rgba(255,255,255,.09);color:#fff}
button.b.on{background:rgba(255,106,42,.16);border-color:rgba(255,106,42,.5);color:#ffb08a}
button.b kbd{font:600 8px/1 var(--mono);color:#5c626c;border:1px solid rgba(255,255,255,.1);border-radius:3px;padding:2px 3px}
button.b.on kbd{color:#c07a52;border-color:rgba(255,106,42,.3)}
button.b .dot{width:5px;height:5px;border-radius:50%;background:#4a505a;display:block}
button.b.on .dot{background:var(--acc);box-shadow:0 0 7px var(--acc)}

/* ---- steps ---- */
#steps{position:fixed;left:26px;top:152px;width:250px;z-index:7;padding:12px;display:none}
#steps.on{display:block}
#steps .st{font:600 9px/1 var(--mono);letter-spacing:.18em;color:var(--dim);margin-bottom:9px}
#steps .it{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:6px;cursor:pointer;font:400 11.5px/1.3 var(--sans);color:#8d939d;transition:.14s}
#steps .it:hover{background:rgba(255,255,255,.05);color:#d6dae1}
#steps .it b{width:17px;height:17px;flex:0 0 17px;border-radius:50%;border:1px solid rgba(255,255,255,.14);font:600 8.5px/15px var(--mono);text-align:center;color:#6a707a}
#steps .it.done{color:#c3c8d1}
#steps .it.done b{background:rgba(255,106,42,.9);border-color:transparent;color:#0a0a0a}
#steps .it.cur b{border-color:var(--acc);color:var(--acc)}

/* ---- tour ---- */
#tour{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(10px);width:min(520px,calc(100vw - 48px));z-index:9;padding:14px 16px;opacity:0;pointer-events:none;transition:.3s}
#tour.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#tour .th{display:flex;align-items:center;gap:9px;font:600 9px/1 var(--mono);letter-spacing:.16em;color:var(--acc)}
#tour .th span{color:#6a707a;letter-spacing:.1em}
#tour h3{margin:9px 0 0;font:400 16px/1.2 var(--sans)}
#tour p{margin:7px 0 11px;font:400 11.5px/1.7 var(--sans);color:#9aa0aa}
#tour .tf{display:flex;align-items:center;gap:8px}
#tour .dots{display:flex;gap:5px;margin-right:auto}
#tour .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18);display:block;cursor:pointer}
#tour .dots i.on{background:var(--acc);box-shadow:0 0 6px var(--acc)}
#tour button.b{padding:6px 10px;font-size:10.5px}

/* ---- system chips ---- */
#chips{position:fixed;right:20px;bottom:20px;z-index:7;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;padding:10px 12px;transition:.3s}
#chips.hide{opacity:0;transform:translateY(10px);pointer-events:none}
#chips .ch{display:flex;align-items:center;gap:6px;font:500 10px/1.6 var(--mono);color:#8d939d;cursor:pointer;white-space:nowrap}
#chips .ch i{width:6px;height:6px;border-radius:2px;display:block;background:var(--s1)}
#chips .ch:hover{color:#dfe3e9}

#toast{position:fixed;left:50%;top:74px;transform:translateX(-50%) translateY(-8px);z-index:20;padding:8px 15px;border-radius:20px;background:rgba(255,106,42,.92);color:#120c08;font:600 11px/1 var(--sans);opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}

#loader{position:fixed;inset:0;z-index:40;background:#07080a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .55s}
#loader.gone{opacity:0;pointer-events:none}
#loader .tl{width:220px;height:1px;background:rgba(255,255,255,.1);overflow:hidden}
#loader .tl i{display:block;height:1px;width:0;background:var(--acc);transition:width .2s}
#loader .tx{font:600 9px/1 var(--mono);letter-spacing:.34em;color:#585e68}

@media(max-width:1100px){
  #dash{width:250px;right:12px;top:12px}
  .rpmRow b{font-size:32px}
  #card{width:225px;left:14px;top:118px}
}
@media(max-width:900px){
  #dash{width:216px;padding:9px;transform:scale(.94);transform-origin:top right}
  #brand{left:14px;top:14px}
  #brand h1{font-size:24px}
  #hint{display:none}
  #card{left:14px;top:auto;bottom:150px;width:min(238px,44vw)}
  #steps{left:14px;top:auto;bottom:150px;width:214px}
  #bar{left:8px;right:8px;bottom:8px;transform:none;max-width:none;padding:7px 9px;gap:8px;overflow-x:auto}
  #bar .sl{flex:0 0 auto}
  #bar .btns{flex-wrap:nowrap}
  button.b kbd{display:none}
  #chips{left:8px;right:auto;bottom:78px;grid-template-columns:1fr 1fr 1fr;padding:8px;max-width:calc(100vw - 16px)}
  #tour{left:8px;right:8px;bottom:80px;width:auto;transform:translateY(10px)}
  #tour.on{transform:none}
  #toast{top:58px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<header id="brand">
  <div class="kicker">PROCEDURAL · REAL-TIME</div>
  <h1>V12<span>6.5 L</span></h1>
  <div class="sub">60° V · DOHC · 48V · NA</div>
</header>

<div id="hint"><b>拖拽</b> 旋转 · <b>滚轮</b> 缩放 · <b>单击</b> 选取 · <b>双击</b> 聚焦 · <b>R</b> 点火 · <b>空格</b> 视角自转</div>

<aside id="dash" class="panel">
  <canvas id="tach" width="600" height="224"></canvas>
  <div class="rpmRow"><b id="rpmVal">0</b><span>R/MIN</span><i id="lamp">STANDBY</i></div>
  <div class="powRow">
    <div><b id="hpVal">—</b><span>PS</span></div>
    <div><b id="nmVal">—</b><span>N·M</span></div>
    <div><b id="thrVal">0</b><span>% 节气门</span></div>
  </div>
  <canvas id="curves" width="600" height="176"></canvas>
  <canvas id="cyc" width="600" height="132"></canvas>
  <div id="fire"></div>
  <div class="dashFoot"><span>1-12 点火顺序</span><u></u><span id="fpsTag">—</span></div>
</aside>

<aside id="card" class="panel hidden">
  <div class="cr"><i id="cDot"></i><span id="cSys">SYSTEM</span><button id="cClose" title="取消选中">×</button></div>
  <h2 id="cZh">—</h2>
  <div class="en" id="cEn">—</div>
  <div class="spec" id="cSpec"></div>
  <p id="cDesc"></p>
</aside>

<div id="steps" class="panel">
  <div class="st">分步拆解 · STEP</div>
  <div id="stepList"></div>
</div>

<div id="tour" class="panel">
  <div class="th"><b id="tNo">01</b><span>/07</span><em style="font-style:normal;margin-left:auto;color:#5c626c">← → 切换 · ESC 退出</em></div>
  <h3 id="tTitle">—</h3>
  <p id="tDesc">—</p>
  <div class="tf">
    <div class="dots" id="tDots"></div>
    <button class="b" id="tPrev">上一步</button>
    <button class="b" id="tNext">下一步</button>
  </div>
</div>

<div id="bar" class="panel">
  <div class="sl">
    <label>拆解</label>
    <input id="exp" type="range" min="0" max="100" value="0">
    <label><b id="expVal">0%</b></label>
  </div>
  <div class="sl wide">
    <label>转速</label>
    <input id="rpmSl" type="range" min="0" max="1000" value="0" step="1">
    <label><b id="rpmSlVal">0</b></label>
  </div>
  <div class="btns">
    <button class="b" id="bIgnite" data-act="ignite"><span class="dot"></span>点火<kbd>R</kbd></button>
    <button class="b" id="bDemo" data-act="demo">演示<kbd>E</kbd></button>
    <button class="b" id="bStep" data-act="step">分步<kbd>S</kbd></button>
    <button class="b" id="bXray" data-act="xray">透视<kbd>X</kbd></button>
    <button class="b" id="bColor" data-act="color">着色<kbd>C</kbd></button>
    <button class="b" id="bSpin" data-act="spin">自转<kbd>空格</kbd></button>
    <button class="b" id="bTour" data-act="tour">导览<kbd>T</kbd></button>
    <button class="b" id="bAudio" data-act="audio">声音<kbd>M</kbd></button>
    <button class="b" id="bShare" data-act="share">分享</button>
    <button class="b" id="bShot" data-act="shot">截图</button>
  </div>
</div>

<div id="chips" class="panel hide"></div>
<div id="toast"></div>
<div id="loader"><div class="tl"><i id="ldBar"></i></div><div class="tx">ASSEMBLING</div></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"}}
</script>
<script type="module">
/* ============================================================
   V12 · 6.5L · 60° DOHC 48V — 程序化实时拆解模型
   1 scene unit = 1 cm
   ============================================================ */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const DEG = Math.PI / 180;
const TAU = Math.PI * 2;

/* ---- 机械规格（数字即法律） ---- */
const BORE = 9.5, STROKE = 7.64, CR = 3.82, ROD = 14.5, PITCH = 10.2;
/* 同一曲拐销上挂两列各一根连杆，大头必须轴向并排，绝不能同心叠在一起：
   大头半宽 1.35 + 侧隙 → 各偏 1.5（两根之间留 0.3），仍落在销长 ±3.1 内，外侧正好贴住曲柄臂内侧面。
   这是工程上的 offset connecting rod（EP0628708A1）：小头仍对准气缸中心，大头横向偏开，
   杆身在侧向倾 atan(1.5/14.5)=5.9°；另一条路线是整列气缸轴向错开一个连杆宽（bank offset），
   代价是整个左列连同它的链轮平面都要一起挪，模型里不动缸列。 */
const ROD_DX = 1.5;
const BANK = 30 * DEG;
const CYL_X = i => (i - 2.5) * PITCH;          // -25.5 … +25.5
const VALVE_LIFT = 0.8;
const FIRING = [7,5,11,3,9,1,6,12,4,10,2,8];
/* 气门/凸轮轴的横向布置（缸列局部空间）：
   盆形燃烧室，气门向外张开 VB；挺柱顶端因此落在 z=±CAM_Z，
   同列两根凸轮轴拉开到 2·CAM_Z ≈ 6.6 中心距，两只凸轮链轮不再互相叠压。 */
const VALVE_SEAT = 21.15, TAPPET_Y = 24.15, SPRING_Y = 21.55;
const VB = 16.5 * DEG;
const SEAT_Z = 2.4;
const CAM_Z = SEAT_Z + Math.sin(VB) * (TAPPET_Y + 0.15 - VALVE_SEAT);
const CAM_Y = 27.6;

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b - a) * t;
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

/* ============================ 渲染器 ============================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.6, 900);
camera.position.set(66, 52, 92);

/* 整机离地高度。地面在 y=−12.4，油底壳最低 −11.6 几乎贴地；
   拆解时向下走的零件最深到 −35.6（油底壳），会被不透明的地面挡住看不见。
   把整机抬起来 LIFT 之后，最低的拆解位仍然在 −11 以上，全部可见。
   ★ 相机所有硬编码的取景高度都要同步 +LIFT，否则机位会偏低、整机被推到画面下缘。 */
const LIFT = 19;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 26;
controls.maxDistance = 260;   // 演示机位要拉到 205（拆满时零件四散，近看会顶出画面）
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 8 + LIFT, 0);
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 0.85;

/* ---- 环境光探针 ---- */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.03);
scene.environment = envRT.texture;
pmrem.dispose();

/* ---- 深色摄影棚背景 ---- */
function radialTex(stops, size = 512) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(size * .5, size * .46, size * .02, size * .5, size * .5, size * .72);
  stops.forEach(([p, c]) => gr.addColorStop(p, c));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = radialTex([[0,'#1c2027'],[0.42,'#111419'],[1,'#050607']], 1024);

/* ---- 三点布光 + 轮廓光 + 底部补光 ---- */
const key = new THREE.DirectionalLight(0xfff4ea, 2.7);
key.position.set(-46, 74, 52); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 20; key.shadow.camera.far = 240;
key.shadow.camera.left = -78; key.shadow.camera.right = 78;
key.shadow.camera.top = 78; key.shadow.camera.bottom = -78;
key.shadow.bias = -0.0009; key.shadow.normalBias = 0.34;

/* ======================= 程序化贴图 ======================= */
function makeGrain(size = 256) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    let n = 126 + Math.random() * 40;
    if (Math.random() < 0.018) n -= 30 + Math.random() * 26;
    if (Math.random() < 0.01) n += 26;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = n;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(7, 7);
  t.colorSpace = THREE.NoColorSpace;
  return t;
}
function makeBrushed(size = 512) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d');
  g.fillStyle = '#8b8b8b'; g.fillRect(0, 0, size, size);
  for (let i = 0; i < 5200; i++) {
    const y = Math.random() * size, w = 24 + Math.random() * 220;
    const v = 96 + Math.random() * 96;
    g.strokeStyle = `rgba(${v},${v},${v},${0.05 + Math.random() * 0.22})`;
    g.lineWidth = 0.6 + Math.random() * 1.6;
    g.beginPath(); g.moveTo(Math.random() * size, y); g.lineTo(Math.random() * size + w, y + (Math.random() - .5) * 1.4); g.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
  t.colorSpace = THREE.NoColorSpace;
  return t;
}

/* ======================= 几何工具 ======================= */
function put(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  if (rx) geo.rotateX(rx);
  if (ry) geo.rotateY(ry);
  if (rz) geo.rotateZ(rz);
  geo.translate(x, y, z);
  return geo;
}
const rbox = (w, h, d, r = 0.18, seg = 2) => new RoundedBoxGeometry(w, h, d, seg, Math.min(r, Math.min(w, h, d) * 0.45));
const cylY = (rt, rb, h, seg = 24, open = false) => new THREE.CylinderGeometry(rt, rb, h, seg, 1, open);
const cylX = (rt, rb, h, seg = 24) => new THREE.CylinderGeometry(rt, rb, h, seg).rotateZ(Math.PI / 2);
const cylZ = (rt, rb, h, seg = 24) => new THREE.CylinderGeometry(rt, rb, h, seg).rotateX(Math.PI / 2);
const torusX = (r, t, seg = 32, rad = 8) => new THREE.TorusGeometry(r, t, rad, seg).rotateX(Math.PI / 2);
const disc = (r, seg = 24) => new THREE.CircleGeometry(r, seg).rotateX(-Math.PI / 2);
/* 缸列局部 → 整机：先就位，再绕曲轴轴线旋转 ±30° */
const bk = (side, geo, x = 0, y = 0, z = 0) => { geo.translate(x, y, z); geo.rotateX(side * BANK); return geo; };

/* 螺旋弹簧 */
function helix(r, len, turns, tubeR, seg = 72, radial = 5) {
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, a = t * turns * TAU;
    pts.push(new THREE.Vector3(Math.cos(a) * r, t * len, Math.sin(a) * r));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg, tubeR, radial, false);
}
/* 统一为非索引，避免 merge 时属性/索引不一致 */
function prep(geo) { return geo.index ? geo.toNonIndexed() : geo; }
function onlyPNU(geo) {
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', geo.getAttribute('position'));
  out.setAttribute('normal', geo.getAttribute('normal') || (() => { geo.computeVertexNormals(); return geo.getAttribute('normal'); })());
  if (geo.getAttribute('uv')) out.setAttribute('uv', geo.getAttribute('uv'));
  else {
    const c = geo.getAttribute('position').count;
    out.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(c * 2), 2));
  }
  return out;
}

function newPart(o) {
  const g = new THREE.Group();
  g.name = o.id;
  engine.add(g);
  const p = Object.assign({
    group: g, frame: g, buckets: {}, meshes: [],
    delay: 0, dir: new THREE.Vector3(0, 1, 0), dist: 12,
    stepCur: new THREE.Vector3(), stepTarget: new THREE.Vector3(),
    hideInXray: false, sysColor: null
  }, o);
  if (o.frameRotX) {
    const f = new THREE.Group();
    f.rotation.x = o.frameRotX;
    g.add(f);
    p.frame = f;
  }
  parts.push(p);
  partById[o.id] = p;
  return p;
}
function add(p, key, geo) { (p.buckets[key] || (p.buckets[key] = [])).push(geo); }
function finalize(p) {
  for (const k in p.buckets) {
    const arr = p.buckets[k].map(g => onlyPNU(prep(g)));
    const merged = arr.length === 1 ? arr[0] : mergeGeometries(arr, false);
    if (!merged) continue;
    merged.computeBoundingSphere();
    // 允许单个零件换材质桶（目前只有缸体/曲轴箱用它换成半透明铸铝），默认仍走全局 MAT
    const mesh = new THREE.Mesh(merged, (p.mats && p.mats[k]) || MAT[k]);
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.userData.part = p.id;
    p.frame.add(mesh);
    p.meshes.push(mesh);
  }
  p.buckets = {};
}

      for (const dx of [-1.05, 1.05]) {
        const lob = lobeBase.clone().rotateX(Math.PI - peak).translate(CYL_X(i) + dx, 0, 0);
        add(p, 'steelDark', lob);
      }
    }
    finalize(p);
    p.spin = new THREE.Group();
    while (p.frame.children.length) p.spin.add(p.frame.children[0]);
    p.spin.position.set(0, CAM_Y, zc);   // 绕自身轴线转，不是绕曲轴
    p.frame.add(p.spin);
    camParts.push(p);
  }
}

/* 桃形凸轮型线（一次生成，逐缸克隆旋转） */
function makeLobe() {
  const shape = new THREE.Shape();
  const N = 28;
  for (let i = 0; i <= N; i++) {
    const a = i / N * TAU;
    const d = Math.abs(wrapPi(a));
    const r = 1.45 + 0.58 * Math.exp(-(d * d) / 0.72);
    const x = Math.sin(a) * r, y = Math.cos(a) * r;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  return new THREE.ExtrudeGeometry(shape, { depth: 1.05, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 1, curveSegments: 8 })
    .translate(0, 0, -0.525).rotateY(Math.PI / 2);
}

/* 凸包 → 链条包络 */
function hull2(points) {
  const p = points.slice().sort((a, b) => a.y - b.y || a.z - b.z);
  const cross = (o, a, b) => (a.y - o.y) * (b.z - o.z) - (a.z - o.z) * (b.y - o.y);
  const lower = [], upper = [];
  for (const pt of p) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], pt) <= 0) lower.pop();
    lower.push(pt);
  }
  for (let i = p.length - 1; i >= 0; i--) {
    const pt = p[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], pt) <= 0) upper.pop();
    upper.push(pt);
  }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

  const hull = hull2(pts);

const _chainAxis = new THREE.Vector3(1, 0, 0);
function updateChains(travel) {
  for (const c of chainAnim) {
    const off = travel / c.len;
    for (let k = 0; k < c.n; k++) {
      const t = ((k / c.n) + off) % 1;
      const pos = c.curve.getPointAt(t < 0 ? t + 1 : t);
      const tan = c.curve.getTangentAt(t < 0 ? t + 1 : t);
      dummy.position.copy(pos);
      dummy.quaternion.setFromUnitVectors(_chainAxis, tan);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      c.im.setMatrixAt(k, dummy.matrix);
    }
    c.im.instanceMatrix.needsUpdate = true;
  }
}

  m.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(1, 1, 1));

const camTween = { active: false, t: 0, dur: 1, fromP: new THREE.Vector3(), toP: new THREE.Vector3(), fromT: new THREE.Vector3(), toT: new THREE.Vector3() };

function focusPart(p) {
  const box = new THREE.Box3();
  for (const m of p.meshes) box.expandByObject(m);

  const sph = box.getBoundingSphere(new THREE.Sphere());
  const r = Math.max(sph.radius, 3.2);

  state.focus = p;
  flyTo(sph.center.clone().addScaledVector(dir, dist), sph.center.clone(), 1.05);

/* ======================= 缸内燃烧（严格按曲轴角驱动） =======================
   查证要点：火花塞在压缩行程末期、压缩上止点之前跳火——怠速 5~15°BTDC，部分负荷 25~40°，
   自然吸气全负荷 15~30°（本机取 30°）。流程是：跳火 → 1~3° 形成约 1mm 火焰核 →
   10-90% 质量燃烧约 20~25° → 缸压峰值落在上止点后 10~15°（即点火后约 40~45°）→
   主燃在 30°ATDC 前后结束，之后只剩暗橙红余烬。
   正常燃烧是火焰前锋推进（十到五十米每秒），不是整缸同时爆——所以这里画的是从火花塞位置
   长出去的一团，越烧越大、到压力峰最亮，禁止整缸一起亮。 */
const ADI = 30;          // 点火提前角，°BTDC
const BURN_END = 108;    // 点火后多少度余烬也灭
const FLAME_GROW = 40;   // 点火后 40°（≈上止点后 10°）长满缸径，对应缸压峰值
/* 亮度归一：bri 峰值约 1.9，用它把颜色在"暗红余烬"和"饱和橙白"之间拉。 */
const FLAME_PEAK = 1.9;
/* ---- 火焰的「形」：不是球，是整只燃烧室 ----
   缸套内壁半径 4.78，活塞冠到燃烧室顶就是那只圆筒。火在筒里必然也是筒形：
   球放进去，四周跟缸壁之间永远隔着一条假缝，看着像浮在缸里的乒乓球。
   这里直接按筒做几何——外筒撑到 BORE_R，里面再套一根 0.66 的内芯，
   外筒压淡、内芯点亮，两层叠起来眼睛才读成「一团有厚度的发光气体」。
   生长照旧是从火花塞长出去：q=0 缩成针尖大的核，40° 撑满全缸。 */
const BORE_R = 4.55;      // 火焰半径上限：缸套内壁 4.78，留 0.23 不贴壁
const FLAME_TOP = 20.95;  // 燃烧室顶（缸列局部坐标，与缸套上口平齐）

/* 湍流贴图：直接在脚本里算四倍频的值噪声（可平铺），别指望 drawImage 放大。
   实测 canvas 放大出来是一块块方格，贴到缸里就是一张被子——必须逐像素插值。 */
const plasmaTex = (() => {
  const S = 256;
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const img = g.createImageData(S, S);
  const OCT = [[4, 0.50], [8, 0.28], [16, 0.15], [32, 0.07]];
  const grids = OCT.map(([n]) => {
    const a = new Float32Array(n * n);
    for (let k = 0; k < n * n; k++) a[k] = Math.random();
    return a;
  });
  const sm = t => t * t * (3 - 2 * t);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      let v = 0;
      for (let o = 0; o < OCT.length; o++) {
        const n = OCT[o][0], amp = OCT[o][1], a = grids[o];
        const fx = x / S * n, fy = y / S * n;
        const x0 = Math.floor(fx), y0 = Math.floor(fy);
        const tx = sm(fx - x0), ty = sm(fy - y0);
        const r0 = (y0 % n) * n, r1 = ((y0 + 1) % n) * n;
        const c0 = x0 % n, c1 = (x0 + 1) % n;
        const top = a[r0 + c0] * (1 - tx) + a[r0 + c1] * tx;
        const bot = a[r1 + c0] * (1 - tx) + a[r1 + c1] * tx;
        v += amp * (top * (1 - ty) + bot * ty);
      }
      const c = v * 255;
      const k = (y * S + x) * 4;
      img.data[k] = img.data[k + 1] = img.data[k + 2] = c; img.data[k + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.NoColorSpace;
  return t;
})();

/* 单层、带端盖的筒就够：外壁 + 上下端盖合起来是一只实心柱。
   之前套了内层又开 DoubleSide，前后壁各画一遍 → 半透明三角面互相叠，
   一层层接缝全露出来，整团火看着像切面宝石。单层正面渲染最干净。 */
const flameGeo = new THREE.CylinderGeometry(1.00, 1.00, 1, 48, 10, false);

const FLAME_VERT = `
varying vec3 vLocal; varying vec2 vUv; varying vec3 vNrm;
void main() {
  vLocal = position;                 // 单位筒局部：y ∈ [-0.5,0.5]，半径 1.00 / 0.66
  vUv = uv; vNrm = normal;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const FLAME_FRAG = `
uniform sampler2D uNoise;
uniform float uTime, uQ, uHeat, uAlpha, uSeed;
varying vec3 vLocal; varying vec2 vUv; varying vec3 vNrm;
void main() {
  float radial = length(vLocal.xz);
  float yN = clamp(vLocal.y + 0.5, 0.0, 1.0);        // 0 = 活塞冠，1 = 燃烧室顶（火花塞侧）
  float wall = 1.0 - abs(vNrm.y);                    // 1 = 侧壁，0 = 端盖
  /* 三层不同尺度、不同流向的滚动：气体在翻卷，不是一张贴图在平移 */
  float n1 = texture2D(uNoise, vUv * vec2(3.0, 2.0) + vec2(uSeed, -uTime * 0.26)).r;
  /* n2 的 U 偏移跟着高度走 → 筒内螺旋翻卷，不是一张纸在平移 */
  float n2 = texture2D(uNoise, vUv * vec2(6.5, 4.2) + vec2(yN * 1.6 - uTime * 0.19, uTime * 0.47 + uSeed)).r;
  float n3 = texture2D(uNoise, vUv * vec2(13.0, 1.5) + vec2(uTime * 0.52, -uTime * 0.82 + uSeed * 2.3)).r;
  float turb = n1 * 0.52 + n2 * 0.30 + n3 * 0.18;
  /* 温度场：火花塞在顶面中心，刚点着时只有顶部白热；烧开之后整缸趋于均匀 */
  float yHeat = mix(0.46, 1.0, pow(1.0 - yN, 0.85));
  yHeat = mix(yHeat, 1.0, clamp(uQ * 0.9, 0.0, 1.0));
  float heat = uHeat * yHeat * (0.78 + 0.40 * turb);
  /* 温度 → 颜色：余烬 → 暗红 → 橙 → 黄 → 白热。
     主色必须压在橙黄：热值一旦整体顶到白，整只缸就糊成一团奶白塑料。
     白热只留在湍流最旺的局部（下面最后一行），那才像火舌交汇处的高光。 */
  vec3 cAsh  = vec3(0.26, 0.028, 0.004);
  vec3 cRed  = vec3(0.86, 0.14, 0.02);
  vec3 cOrg  = vec3(1.00, 0.26, 0.020);
  vec3 cYel  = vec3(1.00, 0.54, 0.075);
  vec3 cWht  = vec3(1.00, 0.94, 0.80);
  vec3 col = mix(cAsh, cRed, smoothstep(0.04, 0.34, heat));
  col = mix(col, cOrg, smoothstep(0.34, 0.68, heat));
  col = mix(col, cYel, smoothstep(0.68, 1.00, heat));
  col = mix(col, cWht, smoothstep(1.00, 1.30, heat) * smoothstep(0.52, 0.86, turb));
  col = mix(vec3(0.70, 0.83, 1.00), col, smoothstep(0.0, 0.18, uQ));  // 开局那一瞬的等离子蓝
  /* 亮度别乘太狠：颜色一旦整体冲过 1.0，ACES 会把它压成黄白，色相全丢。
     明暗起伏交给 alpha 去带，颜色只管色相。 */
  col *= 0.86 + 0.30 * turb;
  /* 外筒压淡、内芯点亮：三层叠起来才是"一团有厚度的气体"，不是两层薄壳 */
  float shell = mix(1.0, 0.72, smoothstep(0.10, 0.98, radial));   // 中轴实、外围薄：气团有厚度感
  /* 端盖边缘按噪声撕开，免得整片火变成一个规规矩矩的圆片贴纸；
     侧壁不吃这一项，它的圆形边界就是缸孔本身。 */
  float rim = mix(1.0 - smoothstep(0.80, 1.0, radial) * (0.85 - 0.85 * n1), 1.0, wall);
  /* 端盖面上中轴更实、外圈更薄：气团有厚度感，不是一张均匀的圆片 */
  float capDepth = mix(0.60 + 0.40 * (1.0 - radial), 1.0, wall);
  float a = uAlpha * shell * rim * capDepth * (0.52 + 0.86 * turb);
  a *= smoothstep(0.0, 0.06, yN);
  gl_FragColor = vec4(col, clamp(a, 0.0, 1.0));
}`;

/* 每缸点火角 = 压缩上止点 − 提前角。上止点由曲拐几何直接给出（d=0 处），
   两列同一曲拐相差 60°，所以同一个上止点角上恰好一对缸、一缸压缩一缸排气；
   按「右列占前一圈、左列占后一圈」把它们摊成每 60° 一次，12 缸均匀。 */
const FLAME = [];
for (const pp of pistonParts) {
  const tdc = ((pp.side * 30 - pp.i * 60) % 360 + 360) % 360;
  const m = Math.round((tdc - 30) / 60) % 6;                 // 上止点角序号 0~5
  const first = (m % 2 === 0) ? 1 : -1;                      // 一上止点两缸轮流先后，两列交替点火
  const cyc = (pp.side === first) ? 0 : 1;
  /* 火挂成活塞组的子节点：缸列倾角、活塞上下、拆解位移、整机离地全都自动跟上，
     不用每帧再过一次世界矩阵。depthTest 必须关——缸套是真·不透明钢管，
     按正确遮挡顺序画，火整根被钢管挡住，外界一点看不到（学长指的就是这个）。 */
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uNoise: { value: plasmaTex }, uTime: { value: 0 }, uQ: { value: 0 },
      uHeat: { value: 0 }, uAlpha: { value: 0 },
      uSeed: { value: (pp.i * 0.37 + pp.side * 0.61 + 5.0) % 7.0 }
    },
    vertexShader: FLAME_VERT, fragmentShader: FLAME_FRAG,
    /* depthTest 必须关。学长要的是「被不透明物遮挡、穿过透明物可见」，
       但这个场景里满足不了：实测打开深度测试后，非透视模式整机视图一点火光都没有
       （气门室盖 + 排气头段 + 缸盖把燃烧室那圈包死），
       连透视模式也被压成一层淡桃子色——因为气门、凸轮、弹簧这些内部件是实心的，
       开着深度就正好挡在火前面。要能看见就只能画在壳上面，代价是某些角度像浮在表面。 */
    transparent: true, depthWrite: false, depthTest: false,
    side: THREE.FrontSide, blending: THREE.NormalBlending
  });
  const fm = new THREE.Mesh(flameGeo, mat);
  fm.renderOrder = 8; fm.visible = false; fm.frustumCulled = false;
  fm.raycast = () => { };                                    // 别让拾取射线撞到火
  pp.g.add(fm);
  FLAME.push({ pp, spark: tdc - ADI + cyc * 360, prev: -1, m: fm, mat });
}
const _fCol = new THREE.Color(), _fPos = new THREE.Vector3();
let combustOn = false;

function updateCombustion(thDeg) {
  /* 非透视模式整套点火特效都不画：12 组火焰网格直接不提交，
     既不浮在壳体表面，也省掉每帧 12 次 transparent 绘制。 */
  if (!state.xray) {
    if (combustOn) {
      for (const f of FLAME) f.m.visible = false;
      flashLight.intensity = 0;
      combustOn = false;
    }
    return;
  }
  combustOn = true;
  let hotI = -1, hotB = 0;
  const tNow = performance.now() * 0.001;
  for (let k = 0; k < FLAME.length; k++) {
    const f = FLAME[k], pp = f.pp, fm = f.m, mat = f.mat;
    const q = ((thDeg - f.spark) % 720 + 720) % 720;        // 点火后走过的曲轴角
    if (f.prev >= 0 && q < f.prev) fireCylinder(pp.n);       // 刚越过点火点：跳一次火
    f.prev = q;

    if (q >= BURN_END) { fm.visible = false; continue; }

    /* 生长：前 40° 从针尖大的核撑满整只缸（10-90% 放热 20~25° + 压力峰 10~15°ATDC）。
       过了 40° 高度不再回缩、只按温度变暗——火是"烧满整只缸"再慢慢熄灭，
       不是缩成一团再消失，那样又变回一个球了。 */
    const g = Math.min(1, q / FLAME_GROW);
    const grow = 0.055 + 0.945 * Math.pow(g, 0.42);
    const down = 1 - Math.max(0, (q - FLAME_GROW) / (BURN_END - FLAME_GROW));
    const bri = (q < 4 ? 1.9 : 0.95 + 1.0 * g) * down;       // 火花最锐，压力峰最亮，之后衰减

    /* 尺寸：活塞组局部坐标里，燃烧室顶 = FLAME_TOP − 销中心y，活塞冠 = 销中心上方 2.53。
       压缩上止点附近这只缸只剩 1mm 高，纯按实高画就成了一张看不见的薄片，
       所以给 0.55 的下限——多出来的 4 毫米正好埋在缸盖垫下面，看不出来。 */
    const sy = pp.g.position.y;
    const crown = 2.53, ceilY = FLAME_TOP - sy;
    const chH = Math.max(0.55, ceilY - crown);
    const hVis = chH * (0.22 + 0.78 * g);
    fm.scale.set(BORE_R * grow, hVis, BORE_R * grow);
    fm.position.set(0, ceilY - hVis * 0.5, 0);               // 顶着燃烧室顶往下长

    const alpha = Math.min(0.98, 0.55 + 0.45 * Math.min(1, bri / FLAME_PEAK));
    mat.uniforms.uTime.value = tNow;
    mat.uniforms.uQ.value = g;
    mat.uniforms.uHeat.value = Math.min(0.98, bri * 0.52);
    mat.uniforms.uAlpha.value = alpha;
    fm.visible = true;

    if (bri > hotB) { hotB = bri; hotI = k; }
  }

  if (hotI >= 0) {
    FLAME[hotI].m.getWorldPosition(_fPos);
    flashLight.position.copy(_fPos);
    flashLight.intensity = 210 * Math.min(1, hotB / FLAME_PEAK);
  } else flashLight.intensity = 0;
}

function animateMechanics() {
  const th = state.crank;
  const thDeg = th / DEG;
  crank.spin.rotation.x = th;
  for (const c of camParts) c.spin.rotation.x = th * 0.5;
  for (const s of sprocketSpins) s.g.rotation.x = th * s.k;
  if (flywheel.spin) flywheel.spin.rotation.x = th;
  if (damper.spin) damper.spin.rotation.x = th;
  const travel = th * CR * 0.92;
  if (Math.abs(travel - chainLastTravel) > 0.004) { chainLastTravel = travel; updateChains(travel); }

  for (const pp of pistonParts) {
    const d = (thDeg + pp.i * 60 - pp.side * 30) * DEG;   // 缸列局部坐标系里的曲拐角
    const s = CR * Math.cos(d) + Math.sqrt(ROD * ROD - CR * CR * Math.sin(d) * Math.sin(d));
    pp.g.position.set(CYL_X(pp.i), s, 0);                 // 活塞沿缸轴（缸列局部 +Y）
    const rp = rodParts.find(r => r.side === pp.side && r.i === pp.i);
    if (rp) {
      /* 连杆要按世界坐标摆：大头 = 曲拐销世界位置，小头 = 活塞销世界位置。
         曲拐世界角 = 局部角 + 缸列倾角；活塞销世界位置 = (±BANK 绕 X 转 30°)。
         以前直接拿局部向量相减，还带着 CYL_X 的横向分量，杆身就整体朝轴向倒过去了。 */
      const thw = d + pp.side * BANK;
      // 大头在销上偏开 ROD_DX（同销两根连杆并排），小头仍对准气缸中心线
      _pin.set(CYL_X(pp.i) + pp.side * ROD_DX, CR * Math.cos(thw), CR * Math.sin(thw));
      _dir.set(CYL_X(pp.i), s * Math.cos(BANK), pp.side * s * Math.sin(BANK)).sub(_pin).normalize();
      /* 摆姿态不能用 setFromUnitVectors(up, dir)——那是「最小旋转」，一旦 dir 带横向分量，
         连杆会绕自身轴被滚一个角度，大头孔的轴就歪出曲拐销的方向，整根杆看上去是拧的。
         这里显式搭正交基：+Y = 杆身方向，+X 尽量贴住世界 X（曲拐销轴向），Z 由叉积补出来。 */
      _rx.set(1, 0, 0).addScaledVector(_dir, -_dir.x).normalize();
      _rz.crossVectors(_rx, _dir).normalize();
      _basis.makeBasis(_rx, _dir, _rz);
      rp.g.position.copy(_pin);
      rp.g.quaternion.setFromRotationMatrix(_basis);
      rp.b.position.copy(_pin);      // 大头环是绕销轴对称的，只需对位、不能带侧倾
      rp.b.quaternion.identity();
    }
  }
  for (const vs of valveSets) {
    for (let j = 0; j < vs.list.length; j++) {
      const v = vs.list[j];
      const ph = CYL_PHASE[v.n];
      const peak = (v.isIn ? peakIntake(ph) : peakExhaust(ph)) / 2 * DEG;
      const dd = wrapPi(th * 0.5 - peak);
      const lift = VALVE_LIFT * Math.exp(-(dd * dd) / 0.52);
      // 气门沿自身（已张开的）轴线运动：先把原点放到气门座，再沿轴向下让升程
      const ay = Math.cos(v.tilt), az = Math.sin(v.tilt);
      dummy.rotation.set(v.tilt, 0, 0);
      const o1 = 0.32 - lift;
      dummy.position.set(v.x, VALVE_SEAT + ay * o1, v.z + az * o1);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix(); vs.vm.setMatrixAt(j, dummy.matrix);
      const o2 = TAPPET_Y + 0.15 - VALVE_SEAT - lift;
      dummy.position.set(v.x, VALVE_SEAT + ay * o2, v.z + az * o2);
      dummy.updateMatrix(); vs.tm.setMatrixAt(j, dummy.matrix);
      const o3 = SPRING_Y + 0.05 - VALVE_SEAT - lift;
      dummy.position.set(v.x, VALVE_SEAT + ay * o3, v.z + az * o3);
      dummy.scale.set(1, 1 - lift * 0.30, 1);
      dummy.updateMatrix(); vs.sm.setMatrixAt(j, dummy.matrix);
    }
    vs.vm.instanceMatrix.needsUpdate = true;
    vs.tm.instanceMatrix.needsUpdate = true;
    vs.sm.instanceMatrix.needsUpdate = true;
  }
  updateCombustion(thDeg);
}

function cylDa(n) { return n <= 6 ? { side: -1, i: n - 1 } : { side: 1, i: 12 - n }; }
function fireCylinder(n) {
  const { side, i } = cylDa(n);
  /* bankToWorld 只做缸列绕 X 的旋转，返回的是**整机局部**坐标；火星 sprite 和点光源都挂在 scene 上，
     所以必须再过一道 engine.localToWorld 补上 LIFT。原来漏了这一步，火花整整低了 19cm，
     正好落在油底壳那一层——这就是"火星显示位置错了"。 */
  const pos = engine.localToWorld(bankToWorld(side, new THREE.Vector3(CYL_X(i), 20.6, 0)));
  flashPos.copy(pos);
  /* 点火特效（火星闪光、缸内燃烧、缸内点光）只在透视模式下给。
     非透视是「看整台机器」的视角，燃烧室被缸盖、气门室盖、排气头段包死，
     硬画出来只能浮在壳表面，反而假——学长定的：非透视不加点火特效。 */
  if (state.xray) {
    const f = flashes[flashIdx++ % flashes.length];
    f.sp.position.copy(pos); f.sp.material.opacity = 0.95; f.life = 1;
  }
  // 排气脉冲
  const ec = exhaustCurves.find(c => c.side === side && c.i === i);
  if (ec) {
    const p = pulses.find(p => !p.active) || pulses[0];
    p.active = true; p.t = 0; p.curve = ec.curve; p.sp.material.color.setHex(side > 0 ? 0xff9a5a : 0xffc499);
  }
  // 仪表高亮
  hotCyl = n; hotTimer = 0.12;
}

const curveC = document.getElementById('curves'), curveX = curveC.getContext('2d');
const cycC = document.getElementById('cyc'), cycX = cycC.getContext('2d');

const torqueAt = rpm => 715 * Math.exp(-Math.pow((rpm / 1000 - 7.2) / 5.6, 2));
const powerAt = rpm => torqueAt(rpm) * rpm / 9549 * 1.35962;

function drawTach() {
  const W = 600, H = 224, cx = 300, cy = 208, R = 156;
  tachX.clearRect(0, 0, W, H);
  const a0 = 150 * DEG, a1 = 390 * DEG;
  const ang = v => a0 + (a1 - a0) * clamp(v, 0, 1);
  // 底弧
  tachX.lineWidth = 9; tachX.strokeStyle = 'rgba(255,255,255,.07)';
  tachX.beginPath(); tachX.arc(cx, cy, R, a0, a1); tachX.stroke();
  // 红线区
  tachX.strokeStyle = 'rgba(255,80,50,.55)';
  tachX.beginPath(); tachX.arc(cx, cy, R, ang(7800 / 9000), a1); tachX.stroke();
  // 转速弧
  const t = clamp(state.rpm / 9000, 0, 1);
  const grd = tachX.createLinearGradient(0, 0, W, 0);
  grd.addColorStop(0, '#ffb27a'); grd.addColorStop(.72, '#ff6a2a'); grd.addColorStop(1, '#ff3b2a');
  tachX.strokeStyle = grd; tachX.lineCap = 'round';
  tachX.beginPath(); tachX.arc(cx, cy, R, a0, ang(t)); tachX.stroke();
  // 刻度
  for (let v = 0; v <= 9000; v += 500) {
    const a = ang(v / 9000), major = v % 1000 === 0;
    const r1 = R - 16, r2 = R - (major ? 30 : 23);
    tachX.strokeStyle = v >= 7800 ? 'rgba(255,120,90,.85)' : (major ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.2)');
    tachX.lineWidth = major ? 2 : 1.2;
    tachX.beginPath();
    tachX.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
    tachX.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    tachX.stroke();
    if (major) {
      tachX.fillStyle = v >= 7800 ? 'rgba(255,130,100,.9)' : 'rgba(190,198,208,.75)';
      tachX.font = '600 15px ui-monospace,monospace';
      tachX.textAlign = 'center'; tachX.textBaseline = 'middle';
      tachX.fillText(v / 1000, cx + Math.cos(a) * (R - 48), cy + Math.sin(a) * (R - 48));
    }
  }
  // 指针
  const ap = ang(t);
  tachX.strokeStyle = '#fff'; tachX.lineWidth = 2.6; tachX.lineCap = 'round';
  tachX.beginPath(); tachX.moveTo(cx + Math.cos(ap) * 18, cy + Math.sin(ap) * 18);
  tachX.lineTo(cx + Math.cos(ap) * (R - 22), cy + Math.sin(ap) * (R - 22)); tachX.stroke();
  // 换挡灯
  const lit = Math.floor(clamp((state.rpm - 6400) / ((8300 - 6400) / 8), 0, 8));
  const red = state.rpm >= 7600;
  for (let i = 0; i < 8; i++) {
    const bx = 152 + i * 37, by = 16;
    tachX.fillStyle = i < lit ? (red ? '#ff3b2a' : (i < 4 ? '#7fe0a8' : '#ffcf4a')) : 'rgba(255,255,255,.07)';
    tachX.beginPath();
    tachX.roundRect(bx, by, 30, 9, 4);
    tachX.fill();
  }
}

function drawCurves() {
  const W = 600, H = 176, pad = 26;
  curveX.clearRect(0, 0, W, H);
  curveX.strokeStyle = 'rgba(255,255,255,.07)'; curveX.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const y = pad + (H - pad * 1.6) * i / 3;
    curveX.beginPath(); curveX.moveTo(pad, y); curveX.lineTo(W - 8, y); curveX.stroke();
  }
  const xOf = rpm => pad + (W - pad - 10) * (rpm - 800) / (9000 - 800);
  const yT = t => H - 18 - (t / 760) * (H - pad - 22);
  const yP = p => H - 18 - (p / 900) * (H - pad - 22);
  curveX.beginPath();
  for (let rpm = 800; rpm <= 9000; rpm += 100) {
    const x = xOf(rpm), y = yT(torqueAt(rpm));
    rpm === 800 ? curveX.moveTo(x, y) : curveX.lineTo(x, y);
  }
  curveX.strokeStyle = 'rgba(90,160,255,.75)'; curveX.lineWidth = 2; curveX.stroke();
  curveX.beginPath();
  for (let rpm = 800; rpm <= 9000; rpm += 100) {
    const x = xOf(rpm), y = yP(powerAt(rpm));
    rpm === 800 ? curveX.moveTo(x, y) : curveX.lineTo(x, y);
  }
  curveX.strokeStyle = 'rgba(255,106,42,.85)'; curveX.lineWidth = 2; curveX.stroke();
  // 当前工作点

    curveX.fillStyle = '#5aa0ff'; curveX.beginPath(); curveX.arc(x, y1, 3.6, 0, TAU); curveX.fill();
    curveX.fillStyle = '#ff6a2a'; curveX.beginPath(); curveX.arc(x, y2, 3.6, 0, TAU); curveX.fill();
  }
  curveX.font = '600 11px ui-monospace,monospace'; curveX.textAlign = 'left';

  curveX.fillStyle = 'rgba(255,140,90,.95)'; curveX.fillText('功率 PS', pad + 82, 16);
  curveX.fillStyle = 'rgba(140,148,160,.8)';
  curveX.fillText('9000', W - 46, H - 4);
}

const STROKES = ['进气', '压缩', '做功', '排气'];
function drawCycle() {
  const W = 600, H = 132, pad = 20;
  cycX.clearRect(0, 0, W, H);
  const ph = CYL_PHASE[1] || 0;
  const thDeg = ((state.crank / DEG) % 720 + 720) % 720;
  const rel = ((thDeg - ph) % 720 + 720) % 720;   // 1 号缸四冲程相位
  const xOf = a => pad + (W - pad * 2) * (a / 720);
  const yOf = v => H - 30 - v * (H - 62);
  // 四段底纹
  for (let i = 0; i < 4; i++) {
    cycX.fillStyle = i % 2 ? 'rgba(255,255,255,.022)' : 'rgba(255,255,255,.045)';
    cycX.fillRect(xOf(i * 180), 8, xOf(180) - xOf(0), H - 34);
    cycX.fillStyle = i * 180 <= rel && rel < (i + 1) * 180 ? 'rgba(255,106,42,.85)' : 'rgba(140,148,160,.6)';
    cycX.font = '600 10px ui-monospace,monospace'; cycX.textAlign = 'center';
    cycX.fillText(STROKES[i], xOf(i * 180 + 90), H - 6);
  }
  // 活塞相对高度
  cycX.beginPath();
  for (let a = 0; a <= 720; a += 6) {
    const d = (a - 180) * DEG;      // 0 = 进气上止点
    const s = CR * Math.cos(d) + Math.sqrt(ROD * ROD - CR * CR * Math.sin(d) * Math.sin(d));
    const v = (s - (ROD - CR)) / (2 * CR);
    const x = xOf(a), y = yOf(v);
    a === 0 ? cycX.moveTo(x, y) : cycX.lineTo(x, y);
  }
  cycX.strokeStyle = 'rgba(200,208,218,.55)'; cycX.lineWidth = 1.6; cycX.stroke();
  // 气门升程
  const lifts = [[], []];
  for (let a = 0; a <= 720; a += 6) {
    const th = (a + ph) * DEG;
    for (const k of [0, 1]) {
      const peak = (k === 0 ? peakIntake(ph) : peakExhaust(ph)) / 2 * DEG;
      const dd = wrapPi(th * 0.5 - peak);
      lifts[k].push(VALVE_LIFT * Math.exp(-(dd * dd) / 0.52));
    }
  }
  for (const k of [0, 1]) {
    cycX.beginPath();
    for (let i = 0; i < lifts[k].length; i++) {
      const x = xOf(i * 6), y = yOf(lifts[k][i] / 0.95);
      i === 0 ? cycX.moveTo(x, y) : cycX.lineTo(x, y);
    }
    cycX.strokeStyle = k === 0 ? 'rgba(63,191,168,.85)' : 'rgba(200,90,63,.85)';
    cycX.lineWidth = 1.4; cycX.stroke();
  }
  // 游标
  const xp = xOf(rel);
  cycX.strokeStyle = '#ff6a2a'; cycX.lineWidth = 1.6;
  cycX.beginPath(); cycX.moveTo(xp, 8); cycX.lineTo(xp, H - 34); cycX.stroke();
  cycX.fillStyle = 'rgba(160,168,180,.9)'; cycX.font = '600 10px ui-monospace,monospace'; cycX.textAlign = 'left';
  cycX.fillText('1 号缸 · ' + STROKES[Math.floor(rel / 180) % 4] + ' 行程', pad, 14);
  cycX.textAlign = 'right';
  cycX.fillStyle = 'rgba(63,191,168,.9)'; cycX.fillText('— 进气门', W - pad - 52, 14);
  cycX.fillStyle = 'rgba(200,90,63,.9)'; cycX.fillText('— 排气门', W - pad, 14);
}

function updateDash() {
  document.getElementById('rpmVal').textContent = Math.round(state.rpm);  document.getElementById('hpVal').textContent = state.rpm > 300 ? Math.round(powerAt(state.rpm)) : '—';
  document.getElementById('nmVal').textContent = state.rpm > 300 ? Math.round(torqueAt(state.rpm)) : '—';
  document.getElementById('thrVal').textContent = Math.round(state.throttle * 100);
  const lamp = document.getElementById('lamp');
  lamp.textContent = state.running ? (state.rpm > 7600 ? 'REDLINE' : 'RUNNING') : (state.rpm > 200 ? 'SPIN-DOWN' : 'STANDBY');
  lamp.classList.toggle('on', state.running || state.rpm > 200);

/* ======================= 声音（WebAudio 脉冲串模型） ======================= */
const AU = { ctx: null, master: null, nodes: null, analyser: null, ready: false };

function impulseWave(ctx, N = 28) {
  const M = 2048, buf = new Float32Array(M);
  let sum = 0;
  for (let i = 0; i < M; i++) {
    const u = i / M * 4;
    const v = Math.min(1, u / 0.035) * Math.exp(-u * 9);
    buf[i] = v; sum += v;
  }
  const real = new Float32Array(N), imag = new Float32Array(N);
  for (let n = 1; n < N; n++) {
    let re = 0, im = 0;
    for (let i = 0; i < M; i++) {
      const a = TAU * n * i / M;
      re += buf[i] * Math.cos(a); im -= buf[i] * Math.sin(a);
    }
    real[n] = re / sum * 2; imag[n] = im / sum * 2;
  }
  real[0] = 0; imag[0] = 0;
  return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
}
function shaperCurve(k = 2.6, a = 0.18) {
  const n = 4096, c = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = i / (n - 1) * 2 - 1;
    c[i] = Math.tanh(k * x) + a * x * x * Math.sign(x);
  }
  return c;
}
function noiseBuffer(ctx, sec = 2) {
  const n = Math.floor(ctx.sampleRate * sec);
  const b = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = b.getChannelData(0);

  const sc = Math.min(1, maxTex / w, maxTex / h);

  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(1);
  composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  composer.render();
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const g = out.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0, w, h);
  // 还原画布
  renderer.domElement.width = Math.round(innerWidth * dpr);
  renderer.domElement.height = Math.round(innerHeight * dpr);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setPixelRatio(Math.min(devicePixelRatio, 2));
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();

  // 品牌条

  grd.addColorStop(0, 'rgba(8,9,11,0.72)');

  g.fillStyle = grd; g.fillRect(0, h - barH, w, barH);
  g.fillStyle = 'rgba(255,106,42,1)'; g.fillRect(0, h - barH, w, Math.max(1, Math.round(h * 0.0016)));

  g.fillText('V12 6.5L · 60° DOHC 48V', Math.round(w * 0.028), h - barH * 0.62);
  g.fillStyle = 'rgba(190,197,207,.8)';

  g.fillText('爆炸拆解视图 · 1:1 结构比例', Math.round(w * 0.028), h - barH * 0.26);
  g.textAlign = 'right';
  g.fillStyle = 'rgba(255,106,42,.95)';

}

canvas.addEventListener('dblclick', e => {
  const p = pickAt(e.clientX, e.clientY);
  if (p) { selectPart(p); focusPart(p); }
  else exitFocus();
  markInteracted();
});
function markInteracted() {
  if (!state.interacted) { state.interacted = true; setSpin(false); }
}

document.getElementById('cClose').onclick = () => selectPart(null);
document.getElementById('exp').oninput = e => {
  setExplode(parseInt(e.target.value, 10) / 100, true);
  document.getElementById('expVal').textContent = e.target.value + '%';
  shareDirty = true; markInteracted();
};
document.getElementById('bIgnite').onclick = () => toggleIgnite();
document.getElementById('bDemo').onclick = () => runDemo();
document.getElementById('bStep').onclick = () => {
  const on = !document.getElementById('steps').classList.contains('on');
  document.getElementById('steps').classList.toggle('on', on);
  if (on && state.stepCount === 0) setStep(1);
  if (!on) setStep(0);
};
document.getElementById('bXray').onclick = () => { state.xray = !state.xray; document.getElementById('bXray').classList.toggle('on', state.xray); applyXray(); };
document.getElementById('bColor').onclick = () => {
  state.color = !state.color;
  document.getElementById('bColor').classList.toggle('on', state.color);
  document.getElementById('chips').classList.toggle('hide', !state.color || state.tour >= 0);
  applyColor();
};
document.getElementById('bTour').onclick = () => { state.tour < 0 ? goTour(0) : exitTour(); };
document.getElementById('bAudio').onclick = async () => {
  if (!AU.ready) initAudio();
  else if (AU.ctx.state === 'suspended') await AU.ctx.resume();
  state.audio = !state.audio;
  document.getElementById('bAudio').classList.toggle('on', state.audio);
  if (!state.audio) AU.nodes.master.gain.setTargetAtTime(0, AU.ctx.currentTime, 0.09);
  if (state.audio && !state.running) toggleIgnite();
};
document.getElementById('bShare').onclick = () => shareLink(false);
document.getElementById('bShot').onclick = e => exportShot(e.shiftKey ? 4 : 2);
document.getElementById('tPrev').onclick = () => goTour(state.tour - 1);
document.getElementById('tNext').onclick = () => state.tour + 1 >= TOUR.length ? exitTour() : goTour(state.tour + 1);

/* ---- 转速滑块：0 = 熄火；对数映射，低速端每格更细，方便逐帧看气门/活塞 ---- */
const RPM_MIN = 30, RPM_MAX = 8300;
const rpmSl = document.getElementById('rpmSl'), rpmSlVal = document.getElementById('rpmSlVal');
const rpmFromSl = v => v <= 0 ? 0 : Math.round(RPM_MIN * Math.pow(RPM_MAX / RPM_MIN, v / 1000));
const slFromRpm = r => r <= 0 ? 0
  : clamp(Math.round(1000 * Math.log(Math.max(r, RPM_MIN) / RPM_MIN) / Math.log(RPM_MAX / RPM_MIN)), 0, 1000);
function syncRpmSlider(r) {
  rpmSl.value = slFromRpm(r);
  rpmSlVal.textContent = Math.round(r);
}
rpmSl.oninput = () => {
  const r = rpmFromSl(+rpmSl.value);
  rpmSlVal.textContent = r;
  state.manualRpm = true;
  state.rpmSet = r;
  state.throttleTarget = clamp(r / RPM_MAX, 0.04, 1);
  state.running = r > 0;
  document.getElementById('bIgnite').classList.toggle('on', state.running);
  document.getElementById('bDemo').classList.remove('on');
  if (r > 0 && state.audio) { if (!AU.ready) initAudio(); AU.ctx.resume(); }
};
syncRpmSlider(state.rpmTarget);   // 首屏/hash 已设定转速时，让滑块对齐

function toggleIgnite() {
  state.running = !state.running;
  document.getElementById('bIgnite').classList.toggle('on', state.running);
  if (state.running) {
    state.throttleTarget = Math.max(0.08, state.throttleTarget);
    if (state.manualRpm && state.rpmSet > 0) state.rpmTarget = state.rpmSet;
    else { state.manualRpm = false; state.rpmTarget = 900 + state.throttleTarget * (8300 - 900); }
    syncRpmSlider(state.rpmTarget);
    if (state.audio) { if (!AU.ready) initAudio(); AU.ctx.resume(); }
  } else {
    state.throttleTarget = 0;
    state.rpmTarget = 0;
    // 不要清掉滑块设的转速：默认就是 72，关火再点火应当回到同一个速度，而不是跳到怠速
    syncRpmSlider(state.manualRpm ? state.rpmSet : 0);
  }
}
/* 演示专用机位：方向沿用默认视角，只把距离拉到能装下 100% 拆解。
   默认距离 116 在扁窗口里拆到后半程就顶出框了，实测 205 才够。 */
const DEMO_TGT = new THREE.Vector3(0, 8 + LIFT, 0);
const DEMO_CAM = DEMO_TGT.clone().add(new THREE.Vector3(66, 25, 92).normalize().multiplyScalar(205));

/* 视角自转只有一个开关，所有地方都走这里，按钮的亮灭才不会跟状态脱节 */
function setSpin(v) {
  state.autoRotate = !!v;
  const b = document.getElementById('bSpin');
  if (b) b.classList.toggle('on', state.autoRotate);
}
document.getElementById('bSpin').onclick = () => setSpin(!state.autoRotate);

function runDemo() {
  state.demo = true; state.demoDir = 1; state.demoHold = 0;
  if (state.stepCount) setStep(0);
  document.getElementById('bDemo').classList.add('on');
  /* 演示期间镜头完全不动：不自动旋转，也不让「拆解越深相机越后退」生效。
     距离要一次给够——拆满时零件四散，按默认距离看会直接顶出画面。 */
  setSpin(false);
  state.userZoom = true;
  flyTo(DEMO_CAM.clone(), DEMO_TGT.clone(), 0.9);
}

/* ======================= 系统 chips ======================= */
const chipsEl = document.getElementById('chips');
for (const k in SYSTEMS) {
  const d = document.createElement('div');
  d.className = 'ch';
  d.innerHTML = '<i style="background:#' + new THREE.Color(SYSTEMS[k].color).getHexString() + '"></i>' + SYSTEMS[k].zh;
  d.onmouseenter = () => { if (state.color) applyColor(k); };
  d.onmouseleave = () => { if (state.color) applyColor(); };
  chipsEl.appendChild(d);
}

/* ======================= 键盘 ======================= */
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'r') toggleIgnite();
  else if (k === 'x') document.getElementById('bXray').click();
  else if (k === 'c') document.getElementById('bColor').click();
  else if (k === 's') document.getElementById('bStep').click();
  else if (k === 't') document.getElementById('bTour').click();
  else if (k === 'e') runDemo();
  else if (k === 'm') document.getElementById('bAudio').click();
  else if (k === '[') setStep(state.stepCount - 1);
  else if (k === ']') setStep(state.stepCount + 1);
  else if (e.key === 'ArrowUp') { state.manualRpm = false; state.throttleTarget = clamp(state.throttleTarget + 0.06, 0, 1); syncRpmSlider(state.running ? 900 + state.throttleTarget * (8300 - 900) : 0); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { state.manualRpm = false; state.throttleTarget = clamp(state.throttleTarget - 0.06, 0, 1); syncRpmSlider(state.running ? 900 + state.throttleTarget * (8300 - 900) : 0); e.preventDefault(); }
  else if (e.key === 'PageUp') setStep(state.stepCount - 1);
  else if (e.key === 'PageDown') setStep(state.stepCount + 1);
  else if (e.key === 'ArrowLeft' && state.tour >= 0) goTour(state.tour - 1);
  else if (e.key === 'ArrowRight' && state.tour >= 0) goTour(state.tour + 1);
  else if (e.key === ' ') {
    setSpin(!state.autoRotate);
    e.preventDefault();
  } else if (e.key === 'Escape') {
    if (state.tour >= 0) exitTour();
    else if (state.focus) exitFocus();
    else if (state.stepCount) setStep(0);
    else selectPart(null);
  }
  shareDirty = true;
});

/* ======================= 尺寸 ======================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloomPass.setSize(innerWidth, innerHeight);
  selOutline.setSize(innerWidth, innerHeight);
  hovOutline.setSize(innerWidth, innerHeight);
});

/* ======================= 主循环 ======================= */
let lastT = performance.now(), dashAcc = 0, fpsAcc = 0, fpsN = 0, lastFireIdx = 0;

function stepMechanics(dt) {
  // 转速惯性
  state.throttle += (state.throttleTarget - state.throttle) * (1 - Math.exp(-dt / 0.22));
  if (state.running) {
    state.rpmTarget = state.manualRpm ? state.rpmSet : 900 + state.throttle * (8300 - 900);
    state.rpm += (state.rpmTarget - state.rpm) * (1 - Math.exp(-dt / 0.5));
  } else {
    state.rpm += (0 - state.rpm) * (1 - Math.exp(-dt / 0.85));
    if (state.rpm < 12) state.rpm = 0;
  }
  if (state.rpm > 1) {
    state.crank += (state.rpm / 60) * TAU * dt;
  }
  /* 点火事件不再按 floor(crank/60) 机械触发——那个算法和活塞的真实相位对不上，
     有一半缸的火花落在上止点前 90° 或上止点后 30°。现在统一由 updateCombustion()
     在每缸"越过点火角（压缩上止点前 30°）"的那一刻触发，火花、火焰、排气脉冲、仪表高亮
     全部吃同一个时刻。 */
  animateMechanics();
}

function stepEffects(dt) {
  for (const f of flashes) {
    if (f.life > 0) {
      f.life = Math.max(0, f.life - dt * 5.5);
      f.sp.material.opacity = f.life * 0.95;
      f.sp.scale.setScalar(2.2 + (1 - f.life) * 2.6);
    } else f.sp.material.opacity = 0;
  }
  for (const p of pulses) {
    if (!p.active) continue;
    p.t += dt;
    const dur = 0.34 + 0.1 * (0.5 + 0.5 * state.throttle);
    if (p.t > dur) { p.active = false; p.sp.material.opacity = 0; continue; }
    const u = p.t / dur;
    const pt = p.curve.getPointAt(clamp(u, 0, 1));
    p.sp.position.copy(engine.localToWorld(pt));   // 曲线是整机局部坐标，sprite 在 scene 上，同样要补 LIFT
    p.sp.material.opacity = Math.sin(u * Math.PI) * 0.85;
    p.sp.scale.setScalar(1.8 + Math.sin(u * Math.PI) * 1.4);
  }
  hotTimer = Math.max(0, hotTimer - dt);
}

/* 主循环必须"打不断"：原来 requestAnimationFrame(frame) 写在函数最后一行，
   任何一行抛错（音频、分享写 URL、仪表重绘……）都会让下一帧永远排不上，
   页面当场定格——这就是"点拆解会卡死"最可能的机制。
   现在把循环本体包进 try，出错只记一笔，下一帧照排。 */
function frame(now) {
  try { frameBody(now); } catch (e) {
    if (errs.length < 40) errs.push('frame: ' + (e && e.message || e));
  }
  requestAnimationFrame(frame);
}

function frameBody(now) {
  const dt = Math.min(0.055, (now - lastT) / 1000);
  lastT = now;

  // 爆炸进度
  if (state.demo) {
    /* 拆满先停一秒再回收，让人看清全展开的样子 */
    if (state.demoHold > 0) state.demoHold = Math.max(0, state.demoHold - dt);
    else {
      state.explodeTarget += state.demoDir * dt / 1.9;
      if (state.explodeTarget >= 1) {
        state.explodeTarget = 1; state.demoDir = -1; state.demoHold = 1.0;
      }
      if (state.explodeTarget <= 0) {
        state.explodeTarget = 0; state.demo = false; state.demoHold = 0;
        document.getElementById('bDemo').classList.remove('on');
        state.userZoom = false;                 // 演示结束，把相机的自动后退交还给用户操作
        /* camBase 在补间期间是按 205/(1+0.55·explode) 算的，演示一结束
           就会把相机从 205 拉回 132——必须在这里同步成当前距离，否则收尾时镜头会自己往前扑。 */
        state.camBase = camera.position.distanceTo(controls.target);
        setSpin(true);                          // 归位之后开始缓慢自转，速度沿用原来的 0.32
      }
    }
    syncSlider(state.explodeTarget);
  }
  state.explode += (state.explodeTarget - state.explode) * (1 - Math.exp(-dt * 4.2));

  // 相机补间
  if (camTween.active) {
    camTween.t += dt / camTween.dur;
    const u = easeInOut(clamp(camTween.t, 0, 1));
    camera.position.lerpVectors(camTween.fromP, camTween.toP, u);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, u);
    if (camTween.t >= 1) camTween.active = false;
  }

  // 拆解/分步时自动后退（用户手动缩放后不再干预）
  const dollyT = Math.max(state.explode, state.stepCount * 0.16);
  if (!state.userZoom && !state.focus && !camTween.active) {
    const off = camera.position.clone().sub(controls.target);
    const len = off.length();
    const want = state.camBase * (1 + 0.55 * dollyT);
    if (Math.abs(len - want) > 0.35) {
      off.setLength(lerp(len, want, 1 - Math.exp(-dt * 3.2)));
      camera.position.copy(controls.target).add(off);
    } else if (dollyT < 0.01) state.camBase = len;
  }
  if (state.focus) state.camBase = camera.position.distanceTo(controls.target) / (1 + 0.55 * dollyT);
  if (camTween.active) state.camBase = controls.target.distanceTo(camTween.toP) / (1 + 0.55 * dollyT);

  controls.autoRotate = state.autoRotate && !state.focus;
  /* 0.32 是原来的速度；取负值 = 自转方向反过来（学长 2026-11-16 定） */
  controls.autoRotateSpeed = -0.32;
  controls.update();

  stepMechanics(dt);
  stepEffects(dt);
  applyTransforms(dt);

  // 声音
  if (state.audio && AU.ready) audioUpdate(state.rpm, clamp(state.throttle * 1.15, 0, 1) * (state.running ? 1 : 0) + 0.06, state.throttle);

  // 分享节流
  if (now - lastShare > 2500 && shareDirty) { lastShare = now; shareDirty = false; shareLink(true); }

  // 仪表
  dashAcc += dt;
  if (dashAcc > 0.07) { dashAcc = 0; updateDash(); }

  fpsAcc += dt; fpsN++;
  if (fpsAcc > 1) {
    document.getElementById('fpsTag').textContent = Math.round(fpsN / fpsAcc) + ' FPS';
    fpsAcc = 0; fpsN = 0;
  }

  composer.render();
}

/* ======================= 诊断句柄 ======================= */
const errs = [];
addEventListener('error', e => errs.push(e.message));
addEventListener('unhandledrejection', e => errs.push('promise: ' + e.reason));
let meshCount = 0, triCount = 0, vertCount = 0;
scene.traverse(o => {
  if (!o.isMesh || !o.geometry) return;
  meshCount++;
  const g = o.geometry, n = g.index ? g.index.count : g.attributes.position.count;
  const inst = o.isInstancedMesh ? o.count : 1;
  triCount += (n / 3) * inst;
  vertCount += g.attributes.position.count * inst;
});
window.__v12 = {
  camera, controls, state, parts, scene, renderer, errs, THREE, camTween,
  stats: { parts: parts.length, meshes: meshCount, tris: Math.round(triCount), verts: vertCount }
};

/* ======================= 启动 ======================= */
const ldBar = document.getElementById('ldBar');
function boot() {
  ldBar.style.width = '45%';
  animateMechanics();
  applyTransforms(0);
  ldBar.style.width = '78%';
  updateDash();
  document.getElementById('bIgnite').classList.toggle('on', state.running);   // 默认慢转，按钮初始就是亮的
  syncRpmSlider(state.rpmTarget);
  const restored = applyState(location.hash);
  ldBar.style.width = '100%';
  setTimeout(() => {
    document.getElementById('loader').classList.add('gone');
    if (!restored) {
      // 首屏演出：远端推近 + 62% 拆解态组装归位
      state.intro = true;
      state.explode = 0.62; state.explodeTarget = 0;
      syncSlider(0.62);
      /* 开头不再从远处飞进来：镜头一开始就钉在默认机位 (66,52,92)，
         只让零件自己归位。飞近会把整机顶出画面，也跟后面的拆解演示抢节奏。 */
      camera.position.set(66, 52 + LIFT, 92);
      controls.target.set(0, 8 + LIFT, 0);
      controls.update();
      setTimeout(() => { state.intro = false; syncSlider(state.explode); }, 2500);
    }
    requestAnimationFrame(frame);
    /* 加载完毕后自动跑一次拆解演示（0 → 100% → 0，约 3.8 秒）。
       首屏还有一段 2.4 秒的镜头推近 + 组装演出，所以等它跑完再开始，否则两头抢 explode。
       带 hash 恢复状态时没有那段演出，早一点开始就行。 */
    const kickDemo = (tries) => {
      if (state.demo) return;
      if (state.intro && tries < 20) { setTimeout(() => kickDemo(tries + 1), 200); return; }
      runDemo();
    };
    setTimeout(() => kickDemo(0), restored ? 900 : 2900);
  }, 260);
  if (window.innerWidth > 900) toast('按 R 点火 · 空格自转 · 双击零件聚焦');
}
boot();
</script>
<!--
实现说明（5 行）
1. 全部几何程序化生成：RoundedBox / Cylinder / Extrude（凸轮桃形、扇形配重）/ Tube（贝塞尔歧管、排气头段、螺旋弹簧）/ 自定义 helix 弹簧；零外部模型、零贴图、零音频采样，双击 file:// 即可运行。
2. 转动件：曲轴/飞轮/减振皮带轮 = 曲轴转速，4 凸轮轴与 4 凸轮链轮 = 曲轴/2，链条 132 节链板用 InstancedMesh 沿包络曲线逐帧推进（真在走）；底栏「转速」滑块走对数映射（30~8300 r/min，0 = 熄火），直接接管 rpmTarget，低速端每格约 3%，压到 60 r/min 就能看清单缸四冲程的每一冲。规模：29 个可交互零件 / 139 个 Mesh / 298k 三角面；48 气门、48 弹簧、48 挺柱分别用 4 组 InstancedMesh（进/排 × 左右列），98 颗螺栓 1 个 InstancedMesh 共享模板，其余按材质桶 mergeGeometries 合并。
3. 运动学按规格解算：s(θ)=r·cosδ+√(L²−r²sin²δ)，δ=θ+i·60°−30°σ；连杆按世界坐标摆位（大头=曲拐销世界位置、小头=活塞销世界位置，世界曲拐角=δ+σ·30°），全转角实测小头与活塞销偏差 0.000、杆长恒为 14.5；升程 lift=0.8·exp(−Δ²/0.52)，凸轮转速=曲轴/2；气门按盆形燃烧室向外张开 16.5°，挺柱顶落在缸列局部 z=±3.295，同列两凸轮轴中心距因此为 6.59、凸轮链轮（齿顶半径 2.9）不再互相叠压，气门/挺柱/弹簧沿各自倾斜轴做升程；每 60° 点火一次，顺序 7-5-11-3-9-1-6-12-4-10-2-8，事件调度用曲轴绝对角扫描 (prev,now] 不漏火。
4. 声音为 WebAudio 脉冲串模型：时域脉冲 rise·e^(−u·decay) → 傅里叶系数 → PeriodicWave，双振荡器 ±5 cents，tanh(2.6x)+0.18x²·sgn(x) 过载，三级 peaking 排气共振 + 随转速低通，四层同步噪声，6% 卷积混响；renderAudioBase64() 用 OfflineAudioContext 离线渲染 WAV（实测 RMS 0.234 / 峰值 0.787）。
